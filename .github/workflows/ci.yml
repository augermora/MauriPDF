name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MauriPDF.slnx

      - name: Build
        run: dotnet build MauriPDF.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MauriPDF.slnx --configuration Release --no-build
